<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>与商细蕊对话</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 420px;
            height: 90vh;
            max-height: 800px;
            background: #ededed;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* 顶部导航栏 */
        .chat-header {
            background: #ededed;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #d9d9d9;
        }

        .chat-header .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            background: linear-gradient(135deg, #c9a227 0%, #8b6914 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-right: 12px;
        }

        .chat-header .info {
            flex: 1;
        }

        .chat-header .name {
            font-size: 16px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .chat-header .status {
            font-size: 12px;
            color: #888;
        }

        .chat-header .actions {
            display: flex;
            gap: 15px;
        }

        .chat-header .action-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: transparent;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1a1a1a;
            font-size: 18px;
        }

        /* 消息区域 */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 15px;
            background: #ededed;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            max-width: 100%;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.user {
            flex-direction: row-reverse;
        }

        .message .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .message.bot .avatar {
            background: linear-gradient(135deg, #c9a227 0%, #8b6914 100%);
        }

        .message.user .avatar {
            background: linear-gradient(135deg, #07c160 0%, #06ad56 100%);
        }

        .message .bubble {
            max-width: 70%;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
            word-wrap: break-word;
        }

        .message.bot .bubble {
            background: #fff;
            color: #1a1a1a;
            border-top-left-radius: 2px;
        }

        .message.user .bubble {
            background: #95ec69;
            color: #1a1a1a;
            border-top-right-radius: 2px;
        }

        /* 输入区域 */
        .chat-input {
            background: #f7f7f7;
            padding: 10px 15px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            border-top: 1px solid #d9d9d9;
        }

        .chat-input textarea {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            resize: none;
            max-height: 100px;
            min-height: 36px;
            background: #fff;
            outline: none;
            font-family: inherit;
        }

        .chat-input .send-btn {
            width: 36px;
            height: 36px;
            border-radius: 6px;
            background: #07c160;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            transition: background 0.2s;
        }

        .chat-input .send-btn:hover {
            background: #06ad56;
        }

        .chat-input .send-btn:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        /* 打字指示器 */
        .typing-indicator {
            display: none;
            padding: 10px 14px;
            background: #fff;
            border-radius: 8px;
            border-top-left-radius: 2px;
            max-width: 70px;
        }

        .typing-indicator.active {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: #999;
            border-radius: 50%;
            animation: typing 1.4s infinite ease-in-out;
        }

        .typing-indicator span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-indicator span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
            }
            30% {
                transform: translateY(-8px);
            }
        }

        /* 滚动条样式 */
        .chat-messages::-webkit-scrollbar {
            width: 6px;
        }

        .chat-messages::-webkit-scrollbar-track {
            background: transparent;
        }

        .chat-messages::-webkit-scrollbar-thumb {
            background: #c1c1c1;
            border-radius: 3px;
        }

        /* 时间标记 */
        .time-divider {
            text-align: center;
            font-size: 12px;
            color: #b2b2b2;
            padding: 5px 0;
        }

        /* 欢迎消息 */
        .welcome-message {
            text-align: center;
            padding: 20px;
            color: #888;
            font-size: 13px;
        }

        /* 错误提示 */
        .error-message {
            text-align: center;
            padding: 20px;
            color: #e74c3c;
            font-size: 13px;
            background: #ffeaea;
            border-radius: 8px;
            margin: 10px;
        }

        /* 重试按钮 */
        .retry-btn {
            background: #07c160;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="avatar">🎭</div>
            <div class="info">
                <div class="name">商细蕊</div>
                <div class="status">戏比命大 · 水云楼班主</div>
            </div>
            <div class="actions">
                <button class="action-btn" title="清空对话" onclick="clearChat()">🗑</button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="welcome-message">
                今天是 2026年4月8日
            </div>
            <div class="time-divider">现在</div>
            <div class="message bot">
                <div class="avatar">🎭</div>
                <div class="bubble">
                    二爷，您来了。我以商细蕊的视角和您聊，基于《鬓边不是海棠红》台词推断。<br><br>
                    戏听一出少一出，您想问什么，尽管说。
                </div>
            </div>
        </div>

        <div class="chat-input">
            <textarea id="messageInput" placeholder="输入消息..." rows="1"></textarea>
            <button class="send-btn" id="sendBtn" disabled>➤</button>
        </div>
    </div>

    <script>
        // Cloudflare Worker API 地址
        const API_URL = 'https://shang-xirui-worker.zhangshubai001.workers.dev';

        const chatMessages = document.getElementById('chatMessages');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');

        // 对话历史
        let conversationHistory = [];

        // 发送消息
        async function sendMessage() {
            const text = messageInput.value.trim();
            if (!text) return;

            // 添加用户消息
            addMessage(text, 'user');
            messageInput.value = '';
            sendBtn.disabled = true;

            // 添加到历史
            conversationHistory.push({ role: 'user', content: text });

            // 显示打字指示器
            showTyping();

            try {
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        messages: conversationHistory
                    }),
                });

                const data = await response.json();

                hideTyping();

                if (!response.ok) {
                    throw new Error(data.error || '请求失败');
                }

                // 添加AI回复
                addMessage(data.content, 'bot');
                conversationHistory.push({ role: 'assistant', content: data.content });

            } catch (error) {
                hideTyping();
                showError(error.message);
            }
        }

        function addMessage(text, type) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = type === 'bot' ? '🎭' : '👤';

            const bubbleDiv = document.createElement('div');
            bubbleDiv.className = 'bubble';
            bubbleDiv.innerHTML = text.replace(/\n/g, '<br>');

            messageDiv.appendChild(avatarDiv);
            messageDiv.appendChild(bubbleDiv);

            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function showTyping() {
            const typingDiv = document.createElement('div');
            typingDiv.className = 'message bot';
            typingDiv.id = 'typingMessage';

            const avatarDiv = document.createElement('div');
            avatarDiv.className = 'avatar';
            avatarDiv.textContent = '🎭';

            const indicatorDiv = document.createElement('div');
            indicatorDiv.className = 'typing-indicator active';
            indicatorDiv.innerHTML = '<span></span><span></span><span></span>';

            typingDiv.appendChild(avatarDiv);
            typingDiv.appendChild(indicatorDiv);

            chatMessages.appendChild(typingDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function hideTyping() {
            const typingMessage = document.getElementById('typingMessage');
            if (typingMessage) {
                typingMessage.remove();
            }
        }

        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.innerHTML = `
                连接失败：${message}<br>
                <button class="retry-btn" onclick="this.parentElement.remove()">关闭</button>
            `;
            chatMessages.appendChild(errorDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function clearChat() {
            conversationHistory = [];
            chatMessages.innerHTML = `
                <div class="welcome-message">
                    今天是 2026年4月8日
                </div>
                <div class="time-divider">现在</div>
                <div class="message bot">
                    <div class="avatar">🎭</div>
                    <div class="bubble">
                        二爷，您来了。我以商细蕊的视角和您聊，基于《鬓边不是海棠红》台词推断。<br><br>
                        戏听一出少一出，您想问什么，尽管说。
                    </div>
                </div>
            `;
        }

        // 事件监听
        messageInput.addEventListener('input', () => {
            sendBtn.disabled = !messageInput.value.trim();
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        sendBtn.addEventListener('click', sendMessage);

        // 自动聚焦输入框
        messageInput.focus();
    </script>
</body>
</html>

    <script type="text/javascript">
        function loadLib(url) {
            var script = document.createElement("script");
            script.async = false;
            script.src = url;
            document.body.appendChild(script);
        }


        function wxLogin(gameUrl) {
            gameUrl = window.location.href;
            location.href = "https://open.weixin.qq.com/connect/oauth2/authorize?appid=wxd4f1448ebbb567a4&redirect_uri=" + gameUrl
                + "&response_type=code&scope=snsapi_base&state=" + new Date().getTime() + "#wechat_redirect";
        }

        function getUrlParam(name) {
            var search = window.location.search;
            var matched = search
                .slice(1)
                .match(new RegExp('(^|&)' + name + '=([^&]*)(&|$)', 'i'));
            return search.length ? matched && matched[2] : null;
        }
    </script>

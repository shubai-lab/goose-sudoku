<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>儿童学习游戏</title>
    <style>
        body {
            font-family: 'Microsoft YaHei', sans-serif;
            text-align: center;
            padding: 50px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            color: white;
            font-size: 2.5em;
            margin-bottom: 30px;
        }
        .game-list {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        .game-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transition: transform 0.3s;
            text-decoration: none;
            color: #333;
            min-width: 200px;
        }
        .game-card:hover {
            transform: translateY(-5px);
        }
        .game-card h2 {
            margin: 0 0 10px 0;
            color: #667eea;
        }
        .game-card p {
            color: #666;
            margin: 0;
        }
    </style>
</head>
<body>
    <h1>🎮 儿童学习游戏</h1>
    <div class="game-list">
        <a href="counting-match-game.html" class="game-card">
            <h2>数物对应</h2>
            <p>数一数，匹配正确的数量</p>
        </a>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>合成大正鹅</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #DCDDF6 0%, #c8c6e8 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            touch-action: none;
            -webkit-overflow-scrolling: touch;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .title {
            font-size: 48px;
            font-weight: 800;
            color: #5a4a7a;
        }

        .scores {
            display: flex;
            gap: 10px;
        }

        .score-box {
            background: #8B77B9;
            border-radius: 6px;
            padding: 8px 16px;
            text-align: center;
            min-width: 80px;
        }

        .score-label {
            font-size: 11px;
            color: #e8e0f0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .score-value {
            font-size: 22px;
            font-weight: 700;
            color: #fff;
        }

        .score-value.pop {
            animation: scorePop 0.2s ease-out;
        }

        @keyframes scorePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.2); color: #5a4a7a; }
            100% { transform: scale(1); }
        }

        .subtitle {
            color: #5a4a7a;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background: #8B77B9;
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .btn:hover {
            background: #7a6aa8;
        }

        .btn-new {
            background: #6b5b95;
        }

        .btn-new:hover {
            background: #7a6aa8;
        }

        .game-board {
            background: #8B77B9;
            border-radius: 10px;
            padding: 12px;
            position: relative;
            margin: 0 auto;
            width: 380px;
            height: 380px;
        }

        .grid-background {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
            width: 100%;
            height: 100%;
        }

        .grid-cell {
            background: rgba(201, 183, 226, 0.6);
            border-radius: 6px;
        }

        .tiles-container {
            position: absolute;
            top: 12px;
            left: 12px;
            right: 12px;
            bottom: 12px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 12px;
        }

        .tile {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease-out;
            margin: 0;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
        }

        .tile img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 6px;
        }

        .tile-new {
            animation: tileAppear 0.2s ease-out;
        }

        .tile-merged {
            animation: tileMerge 0.2s ease-out;
        }

        @keyframes tileAppear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        @keyframes tileMerge {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(220, 221, 246, 0.95);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .overlay-title {
            font-size: 48px;
            font-weight: 800;
            color: #5a4a7a;
            margin-bottom: 10px;
        }

        .overlay-title.win {
            color: #6b5b95;
        }

        .overlay-subtitle {
            font-size: 16px;
            color: #5a4a7a;
            margin-bottom: 20px;
        }

        .instructions {
            margin-top: 20px;
            padding: 15px;
            background: rgba(139, 119, 185, 0.3);
            border-radius: 8px;
            font-size: 13px;
            color: #5a4a7a;
            line-height: 1.6;
        }

        .instructions strong {
            color: #6b5b95;
        }

        /* 手机适配 1334x750 */
        @media (max-width: 450px) {
            .container {
                padding: 0 10px;
            }
            .title {
                font-size: 32px;
            }
            .header {
                flex-wrap: wrap;
                gap: 10px;
            }
            .game-board {
                width: calc(100vw - 30px);
                max-width: 340px;
                height: auto;
                aspect-ratio: 1;
                padding: 10px;
            }
            .grid-background, .tiles-container {
                gap: 8px;
            }
            .subtitle {
                font-size: 12px;
            }
            .controls {
                flex-wrap: wrap;
            }
            .btn {
                padding: 10px 16px;
                font-size: 13px;
                flex: 1;
                min-width: 100px;
            }
            .instructions {
                font-size: 12px;
                padding: 12px;
            }
        }

        /* 超小屏幕 */
        @media (max-width: 350px) {
            .game-board {
                width: calc(100vw - 20px);
                padding: 8px;
            }
            .grid-background, .tiles-container { gap: 6px; }
            .title { font-size: 28px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">合成大正鹅</div>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">分数</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">最高</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>

        <p class="subtitle">合并正鹅，帮助正鹅披荆斩棘！</p>

        <div class="controls">
            <button class="btn btn-new" id="btn-new">新游戏</button>
            <button class="btn" id="btn-undo">撤销</button>
        </div>

        <div class="game-board" id="game-board">
            <div class="grid-background">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            <div class="tiles-container" id="tiles-container"></div>
            <div class="overlay" id="overlay">
                <div class="overlay-title" id="overlay-title">游戏结束</div>
                <div class="overlay-subtitle" id="overlay-subtitle">最终得分：0</div>
                <button class="btn btn-new" id="btn-retry">再玩一次</button>
            </div>
        </div>

        <div class="instructions">
            <strong>玩法：</strong>使用 <strong>方向键</strong> 或 <strong>滑动屏幕</strong> 移动正鹅。相同的正鹅碰撞时会合并。目标是合成 <strong>最大的正鹅</strong>！
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        var size = 4;
        var grid = [];
        var score = 0;
        var best = 0;
        var history = [];
        var gameOver = false;
        var won = false;
        var isAnimating = false;
        var touchStartX = 0;
        var touchStartY = 0;

        // 本地存储键名
        var SAVE_KEY = 'dazheng-e-2048-save';
        var BEST_KEY = 'dazheng-e-2048-best';

        var tilesContainer, scoreEl, bestEl, overlay, overlayTitle, overlaySubtitle;

        function init() {
            tilesContainer = document.getElementById('tiles-container');
            scoreEl = document.getElementById('score');
            bestEl = document.getElementById('best');
            overlay = document.getElementById('overlay');
            overlayTitle = document.getElementById('overlay-title');
            overlaySubtitle = document.getElementById('overlay-subtitle');

            best = parseInt(localStorage.getItem(BEST_KEY) || '0');
            bestEl.textContent = best;

            // 尝试加载保存的进度
            var savedGame = loadGame();

            if (savedGame) {
                grid = savedGame.grid;
                score = savedGame.score;
                history = savedGame.history || [];
                gameOver = savedGame.gameOver;
                won = savedGame.won;
                overlay.classList.remove('active');
                updateScoreDisplay();
                renderTiles();
            } else {
                // 没有保存的进度，开始新游戏
                grid = [];
                for (var r = 0; r < size; r++) {
                    grid[r] = [];
                    for (var c = 0; c < size; c++) {
                        grid[r][c] = 0;
                    }
                }
                score = 0;
                history = [];
                gameOver = false;
                won = false;
                overlay.classList.remove('active');
                updateScoreDisplay();
                addRandomTile();
                addRandomTile();
                renderTiles();
                saveGame();
            }

            document.getElementById('btn-new').addEventListener('click', restart);
            document.getElementById('btn-undo').addEventListener('click', undo);
            document.getElementById('btn-retry').addEventListener('click', restart);

            setupKeyboard();
            setupTouch();
        }

        // 保存游戏进度
        function saveGame() {
            var saveData = {
                grid: grid,
                score: score,
                history: history.slice(-4), // 只保存最近4步
                gameOver: gameOver,
                won: won,
                timestamp: Date.now()
            };
            localStorage.setItem(SAVE_KEY, JSON.stringify(saveData));
        }

        // 加载游戏进度
        function loadGame() {
            var saved = localStorage.getItem(SAVE_KEY);
            if (saved) {
                try {
                    var data = JSON.parse(saved);
                    // 检查是否是有效的游戏数据
                    if (data.grid && data.grid.length === size) {
                        return data;
                    }
                } catch (e) {
                    console.log('加载存档失败');
                }
            }
            return null;
        }

        // 清除保存的进度
        function clearSave() {
            localStorage.removeItem(SAVE_KEY);
        }

        function restart() {
            clearSave(); // 清除旧存档

            grid = [];
            for (var r = 0; r < size; r++) {
                grid[r] = [];
                for (var c = 0; c < size; c++) {
                    grid[r][c] = 0;
                }
            }

            score = 0;
            history = [];
            gameOver = false;
            won = false;
            overlay.classList.remove('active');

            updateScoreDisplay();
            addRandomTile();
            addRandomTile();
            renderTiles();
            saveGame(); // 保存新游戏进度
        }

        function undo() {
            if (history.length > 0 && !gameOver) {
                var prev = history.pop();
                grid = prev.grid;
                score = prev.score;
                gameOver = false;
                renderTiles();
                updateScoreDisplay();
                saveGame(); // 撤销后保存
            }
        }

        function addRandomTile() {
            var emptyCells = [];
            for (var r = 0; r < size; r++) {
                for (var c = 0; c < size; c++) {
                    if (grid[r][c] === 0) {
                        emptyCells.push({ r: r, c: c });
                    }
                }
            }

            if (emptyCells.length > 0) {
                var cell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                grid[cell.r][cell.c] = Math.random() < 0.9 ? 2 : 4;
                return cell;
            }
            return null;
        }

        function setupKeyboard() {
            document.addEventListener('keydown', function(e) {
                if (gameOver || won || isAnimating) return;

                var direction = null;
                switch (e.key) {
                    case 'ArrowUp': direction = 'up'; break;
                    case 'ArrowDown': direction = 'down'; break;
                    case 'ArrowLeft': direction = 'left'; break;
                    case 'ArrowRight': direction = 'right'; break;
                }

                if (direction) {
                    e.preventDefault();
                    move(direction);
                }
            });
        }

        function setupTouch() {
            var board = document.getElementById('game-board');
            var container = document.querySelector('.container');

            // 触摸开始
            board.addEventListener('touchstart', function(e) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
            }, { passive: true });

            // 触摸移动 - 阻止页面滚动
            board.addEventListener('touchmove', function(e) {
                e.preventDefault();
            }, { passive: false });

            // 触摸结束
            board.addEventListener('touchend', function(e) {
                if (gameOver || won || isAnimating) return;

                var touchEndX = e.changedTouches[0].clientX;
                var touchEndY = e.changedTouches[0].clientY;

                var dx = touchEndX - touchStartX;
                var dy = touchEndY - touchStartY;
                var absDx = Math.abs(dx);
                var absDy = Math.abs(dy);

                if (Math.max(absDx, absDy) < 30) return;

                if (absDx > absDy) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
            }, { passive: true });

            // 鼠标拖拽
            board.addEventListener('mousedown', function(e) {
                touchStartX = e.clientX;
                touchStartY = e.clientY;
            });

            board.addEventListener('mouseup', function(e) {
                if (gameOver || won || isAnimating) return;

                var dx = e.clientX - touchStartX;
                var dy = e.clientY - touchStartY;
                var absDx = Math.abs(dx);
                var absDy = Math.abs(dy);

                if (Math.max(absDx, absDy) < 30) return;

                if (absDx > absDy) {
                    move(dx > 0 ? 'right' : 'left');
                } else {
                    move(dy > 0 ? 'down' : 'up');
                }
            });
        }

        function move(direction) {
            var prevGrid = JSON.parse(JSON.stringify(grid));
            var prevScore = score;

            history.push({ grid: prevGrid, score: prevScore });
            if (history.length > 5) history.shift();

            var moved = false;
            var mergedPositions = [];
            var traversals = getTraversals(direction);
            var merged = [];
            for (var i = 0; i < size; i++) {
                merged[i] = [];
                for (var j = 0; j < size; j++) {
                    merged[i][j] = false;
                }
            }

            traversals.rows.forEach(function(r) {
                traversals.cols.forEach(function(c) {
                    var value = grid[r][c];
                    if (value === 0) return;

                    var result = findFarthestPosition(r, c, direction, merged);

                    if (result.canMerge && grid[result.newR][result.newC] === value) {
                        grid[r][c] = 0;
                        grid[result.newR][result.newC] = value * 2;
                        merged[result.newR][result.newC] = true;
                        score += value * 2;
                        mergedPositions.push({ r: result.newR, c: result.newC });
                        moved = true;
                    } else if (result.newR !== r || result.newC !== c) {
                        grid[r][c] = 0;
                        grid[result.newR][result.newC] = value;
                        moved = true;
                    }
                });
            });

            if (moved) {
                isAnimating = true;
                renderTiles();

                setTimeout(function() {
                    var newTile = addRandomTile();
                    renderTiles(newTile, mergedPositions);
                    updateScoreDisplay();
                    checkGameState();
                    saveGame(); // 自动保存进度

                    setTimeout(function() {
                        isAnimating = false;
                    }, 100);
                }, 100);
            } else {
                history.pop();
            }
        }

        function getTraversals(direction) {
            var rows = [];
            var cols = [];
            for (var i = 0; i < size; i++) {
                rows.push(i);
                cols.push(i);
            }
            if (direction === 'down') rows.reverse();
            if (direction === 'right') cols.reverse();
            return { rows: rows, cols: cols };
        }

        function getVector(direction) {
            switch (direction) {
                case 'up': return { r: -1, c: 0 };
                case 'down': return { r: 1, c: 0 };
                case 'left': return { r: 0, c: -1 };
                case 'right': return { r: 0, c: 1 };
            }
        }

        function findFarthestPosition(r, c, direction, merged) {
            var vector = getVector(direction);
            var value = grid[r][c];
            var newR = r;
            var newC = c;

            while (true) {
                var nextR = newR + vector.r;
                var nextC = newC + vector.c;

                if (nextR < 0 || nextR >= size || nextC < 0 || nextC >= size) break;

                if (grid[nextR][nextC] === 0) {
                    newR = nextR;
                    newC = nextC;
                } else if (grid[nextR][nextC] === value && !merged[nextR][nextC]) {
                    return { newR: nextR, newC: nextC, canMerge: true };
                } else {
                    break;
                }
            }

            return { newR: newR, newC: newC, canMerge: false };
        }

        function checkGameState() {
            if (!won) {
                for (var r = 0; r < size; r++) {
                    for (var c = 0; c < size; c++) {
                        if (grid[r][c] === 2048) {
                            won = true;
                            showOverlay('你赢了！', '得分：' + score, true);
                            return;
                        }
                    }
                }
            }

            if (!canMove()) {
                gameOver = true;
                showOverlay('游戏结束', '最终得分：' + score, false);
            }
        }

        function canMove() {
            for (var r = 0; r < size; r++) {
                for (var c = 0; c < size; c++) {
                    if (grid[r][c] === 0) return true;
                }
            }

            for (var r = 0; r < size; r++) {
                for (var c = 0; c < size; c++) {
                    var value = grid[r][c];
                    if (r < size - 1 && grid[r + 1][c] === value) return true;
                    if (c < size - 1 && grid[r][c + 1] === value) return true;
                }
            }

            return false;
        }

        function showOverlay(title, subtitle, isWin) {
            overlayTitle.textContent = title;
            overlayTitle.className = 'overlay-title' + (isWin ? ' win' : '');
            overlaySubtitle.textContent = subtitle;
            overlay.classList.add('active');
        }

        function updateScoreDisplay() {
            scoreEl.textContent = score;
            scoreEl.classList.remove('pop');
            void scoreEl.offsetWidth;
            scoreEl.classList.add('pop');

            if (score > best) {
                best = score;
                localStorage.setItem(BEST_KEY, best.toString());
                bestEl.textContent = best;
            }
        }

        // 图片素材路径
        var ASSET_PATH = '小游戏/2048-assets/';

        function renderTiles(newTilePos, mergedPositions) {
            newTilePos = newTilePos || null;
            mergedPositions = mergedPositions || [];

            tilesContainer.innerHTML = '';

            for (var r = 0; r < size; r++) {
                for (var c = 0; c < size; c++) {
                    var value = grid[r][c];
                    if (value === 0) continue;

                    var tile = document.createElement('div');
                    tile.className = 'tile';

                    if (newTilePos && newTilePos.r === r && newTilePos.c === c) {
                        tile.classList.add('tile-new');
                    }
                    var isMerged = false;
                    for (var i = 0; i < mergedPositions.length; i++) {
                        if (mergedPositions[i].r === r && mergedPositions[i].c === c) {
                            isMerged = true;
                            break;
                        }
                    }
                    if (isMerged) {
                        tile.classList.add('tile-merged');
                    }

                    // 使用图片
                    var img = document.createElement('img');
                    img.src = ASSET_PATH + value + '.png';
                    img.alt = value;
                    tile.appendChild(img);

                    tile.style.gridRow = (r + 1) + '';
                    tile.style.gridColumn = (c + 1) + '';

                    tilesContainer.appendChild(tile);
                }
            }
        }

        // 页面加载完成后初始化
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    })();
    </script>
</body>
</html>
